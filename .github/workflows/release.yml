name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi

          NOTES_RU="$(jq -r '.notes_ru // ""' latest.json)"
          NOTES_EN="$(jq -r '.notes_en // ""' latest.json)"
          NOTES=$(printf "## LocalDockerServer %s\n\n### Русский\n%s\n\n### English\n%s\n" "$TAG" "$NOTES_RU" "$NOTES_EN")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" releases/LocalDockerServer.dmg --clobber
            gh release edit "$TAG" --title "LocalDockerServer $TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" releases/LocalDockerServer.dmg \
              --title "LocalDockerServer $TAG" \
              --notes "$NOTES" \
              --latest
          fi
